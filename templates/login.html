<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DecodeArena</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0f;
      color: #00ff88;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── ANIMATED BACKGROUND ── */
    .bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-line {
      position: absolute;
      width: 1px;
      background: linear-gradient(180deg, transparent, #00ff8818, transparent);
      animation: fall linear infinite;
    }

    @keyframes fall {
      0%   { top: -100%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    /* ── LOGO ── */
    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.05); }
    }

    .logo h1 {
      font-size: 20px;
      color: #00ff88;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .logo p {
      font-size: 11px;
      color: #333;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* ── CARD ── */
    .card {
      background: #111118;
      border: 0.5px solid #00ff8830;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 0 40px #00ff8808;
    }

    .card h2 {
      font-size: 11px;
      color: #444;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 28px;
      text-align: center;
    }

    /* ── FIELDS ── */
    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 10px;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 13px 16px;
      background: #0a0a0f;
      border: 0.5px solid #222;
      border-radius: 10px;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .field input:focus {
      border-color: #00ff8866;
      box-shadow: 0 0 12px #00ff8810;
    }

    .field input::placeholder { color: #333; }

    /* ── BUTTON ── */
    .btn {
      width: 100%;
      padding: 14px;
      background: #00ff88;
      color: #0a0a0f;
      border: none;
      border-radius: 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      background: #00dd77;
      box-shadow: 0 0 20px #00ff8840;
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    /* ── ERROR ── */
    .error {
      background: #ff003315;
      border: 0.5px solid #ff003344;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #ff6666;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 28px;
      font-size: 10px;
      color: #222;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .divider-line {
      flex: 1;
      height: 0.5px;
      background: #1a1a1a;
    }

    .divider-text {
      font-size: 10px;
      color: #333;
      letter-spacing: 2px;
    }
  </style>

  <script>
    // Generate animated background lines
    window.onload = function() {
      var bg = document.querySelector('.bg');
      for (var i = 0; i < 20; i++) {
        var line = document.createElement('div');
        line.className = 'bg-line';
        line.style.left = (Math.random() * 100) + '%';
        line.style.height = (Math.random() * 30 + 10) + '%';
        line.style.animationDuration = (Math.random() * 8 + 4) + 's';
        line.style.animationDelay = (Math.random() * 5) + 's';
        bg.appendChild(line);
      }
    }
  </script>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <div class="logo">
    <span class="logo-icon">🏴</span>
    <h1>DecodeArena</h1>
    <p>2026</p>
  </div>

  <div class="card">
    <h2>— Team Login —</h2>

    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Team Name</label>
        <input type="text"
               name="team_name"
               placeholder="Enter your team name"
               autocomplete="off"
               required />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required />
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">Ready?</span>
        <div class="divider-line"></div>
      </div>

      <button type="submit" class="btn">
        Enter the Hunt →
      </button>
    </form>
  </div>

  <div class="footer">
    Decode the signals · Follow the trail
  </div>
</div>

</body>
</html>
